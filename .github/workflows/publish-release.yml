name: Publish Release
on:
  push:
    tags:
      - '*.*.*'

jobs:
  build:
    env:
      SOLUTION: 'src/GbxRemote.Net.sln'
      PROJECT: 'src/GbxRemote.Net/GbxRemote.Net.csproj'
    runs-on: ubuntu-latest
    permissions:
        id-token: write
        contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Setup Dependencies
        run: dotnet restore $SOLUTION
      
      - name: Build Solution
        run: dotnet build $SOLUTION --configuration Release -p:Version=${{github.ref_name}} --no-restore
        
      - name: Run Tests
        run: dotnet test $SOLUTION /p:Configuration=Release --verbosity normal
      
      - name: Nuget Pack
        run: dotnet pack $PROJECT /p:Version=${{github.ref_name}} -c Release --no-build --output package/
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: package
          path: ${{ github.workspace }}/package/*.nupkg

      # Get a short-lived NuGet API key
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{secrets.NUGET_USER}} # Recommended: use a secret like ${{ secrets.NUGET_USER }} for your nuget.org username (profile name), NOT your email address

      # Push the package
      - name: NuGet push
        run: dotnet nuget push package/*.nupkg --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json

